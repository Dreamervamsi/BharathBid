<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 600" width="100%" height="100%">
  <g fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round">
    <!-- Ashoka Lion Capital Emblem SVG -->
    <!-- Central Lion Head -->
    <path d="M 200 120 Q 250 80 300 120 Q 320 150 310 180 Q 250 200 190 180 Q 180 150 200 120 Z" stroke-width="8" fill="#1e293b"/>
    <circle cx="230" cy="135" r="5" fill="currentColor"/>
    <circle cx="270" cy="135" r="5" fill="currentColor"/>
    <path d="M 235 155 Q 250 165 265 155" stroke-width="6"/>
    <!-- Left Lion Head -->
    <path d="M 130 150 Q 170 120 200 160 Q 190 200 150 210 Q 120 190 130 150 Z" stroke-width="7" fill="#1e293b"/>
    <circle cx="150" cy="165" r="4" fill="currentColor"/>
    <!-- Right Lion Head -->
    <path d="M 370 150 Q 330 120 300 160 Q 310 200 350 210 Q 380 190 370 150 Z" stroke-width="7" fill="#1e293b"/>
    <circle cx="350" cy="165" r="4" fill="currentColor"/>
    
    <!-- Mane details -->
    <path d="M 140 200 Q 250 260 360 200 Q 380 280 340 340 Q 250 380 160 340 Q 120 280 140 200 Z" stroke-width="8" fill="#0f172a"/>
    <path d="M 180 230 Q 250 280 320 230" stroke-width="5"/>
    <path d="M 170 270 Q 250 320 330 270" stroke-width="5"/>
    
    <!-- Pillars Base / Abacus -->
    <rect x="150" y="340" width="200" height="50" rx="8" stroke-width="8" fill="#1e293b"/>
    
    <!-- Ashoka Chakra Wheel -->
    <circle cx="250" cy="365" r="20" stroke-width="6" fill="#0f172a"/>
    <circle cx="250" cy="365" r="4" fill="currentColor"/>
    <!-- Spokes -->
    <line x1="250" y1="345" x2="250" y2="385" stroke-width="3"/>
    <line x1="230" y1="365" x2="270" y2="365" stroke-width="3"/>
    <line x1="236" y1="351" x2="264" y2="379" stroke-width="3"/>
    <line x1="236" y1="379" x2="264" y2="351" stroke-width="3"/>
    
    <!-- Bull on Right -->
    <path d="M 300 365 Q 320 355 335 365" stroke-width="4"/>
    <!-- Horse on Left -->
    <path d="M 165 365 Q 180 355 200 365" stroke-width="4"/>

    <!-- Bell Capital Base -->
    <path d="M 170 390 Q 250 420 330 390 L 320 440 Q 250 460 180 440 Z" stroke-width="8" fill="#1e293b"/>
    
    <!-- Satyameva Jayate (Hindi Script Representation) -->
    <text x="250" y="495" font-family="Arial, sans-serif" font-weight="900" font-size="32" fill="currentColor" text-anchor="middle" letter-spacing="2">सत्यमेव जयते</text>
    <line x1="160" y1="468" x2="340" y2="468" stroke-width="5"/>
    
    <!-- Subtitle text -->
    <text x="250" y="540" font-family="Arial, sans-serif" font-weight="bold" font-size="28" fill="currentColor" text-anchor="middle" letter-spacing="1">Government Of India</text>
  </g>
</svg>
