version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    container_name: gem_postgres
    environment:
      POSTGRES_DB: gem_forensic
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgrespassword
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  ai-service:
    build:
      context: ./ai-service
    container_name: gem_ai_service
    ports:
      - "8000:8000"
    environment:
      - PORT=8000

  backend:
    build:
      context: ./backend
    container_name: gem_backend
    ports:
      - "8080:8080"
    environment:
      - DB_URL=jdbc:postgresql://postgres:5432/gem_forensic
      - DB_USERNAME=postgres
      - DB_PASSWORD=postgrespassword
      - AI_SERVICE_URL=http://ai-service:8000
    depends_on:
      postgres:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
    container_name: gem_frontend
    ports:
      - "3000:3000"
    depends_on:
      - backend

volumes:
  pgdata:
